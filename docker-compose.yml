services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmlaw
      POSTGRES_PASSWORD: cmlaw_dev_only
      POSTGRES_DB: cmlaw_secureexam
    ports:
      - "5432:5432"
    volumes:
      - cmlaw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmlaw -d cmlaw_secureexam"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cmlaw_pgdata:
